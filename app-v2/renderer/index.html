<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://image.tmdb.org https://img.youtube.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube.com https://vidlink.pro https://vidsrc-embed.ru;">
  <title>CineStream</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/titlebar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/details.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/discover.css">
  <link rel="stylesheet" href="css/watch.css">
  <link rel="stylesheet" href="css/person.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/cropper.css">
  <link rel="stylesheet" href="css/downloads.css">
  <link rel="stylesheet" href="css/report.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/version-check.css">
  <link rel="stylesheet" href="css/activity.css">
</head>

<body>
  <!-- Custom Titlebar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-title">CineStream</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <rect y="5" width="12" height="2" rx="1" />
        </svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="10" height="10" rx="1" />
        </svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path
            d="M1.41 0L6 4.59L10.59 0L12 1.41L7.41 6L12 10.59L10.59 12L6 7.41L1.41 12L0 10.59L4.59 6L0 1.41L1.41 0Z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Main App Container -->
  <div class="app-container">
    <!-- Premium Top Navigation -->
    <nav class="topnav topnav--overlay" id="topnav">
      <a href="#" class="topnav-brand" data-page="home" id="topnav-brand" aria-label="CineStream Home">
        <span class="brand-cine">Cine</span><span class="brand-stream">Stream</span>
      </a>

      <div class="topnav-home-toggle" id="topnav-home-toggle" role="tablist" aria-label="Home content">
        <button type="button" class="home-seg-btn active" data-home-view="movies">Movies</button>
        <button type="button" class="home-seg-btn" data-home-view="tv">TV Series</button>
        <button type="button" class="home-seg-btn" data-home-view="anime">Anime</button>
      </div>

      <div class="topnav-actions">
        <a href="#" class="topnav-icon-btn" data-page="search" title="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
        </a>

        <div class="topnav-profile-wrap" id="topnav-profile-wrap">
          <button type="button" class="topnav-profile" id="user-profile-btn" title="Menu" aria-haspopup="true"
            aria-expanded="false" aria-controls="profile-dropdown">
            <div class="user-avatar" id="user-avatar">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
          </button>

          <div class="topnav-dropdown" id="profile-dropdown" role="menu">
            <button type="button" class="topnav-dropdown-item" data-page="auth" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span id="user-label">Login</span>
            </button>
            <div class="topnav-dropdown-divider"></div>
            <button type="button" class="topnav-dropdown-item" data-page="discover" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
              </svg>
              <span>Discover</span>
            </button>
            <button type="button" class="topnav-dropdown-item" data-page="downloads" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              <span>Downloads</span>
            </button>
            <button type="button" class="topnav-dropdown-item" data-page="activity" id="nav-activity" role="menuitem"
              style="display: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
              </svg>
              <span>Activity</span>
            </button>
            <button type="button" class="topnav-dropdown-item" data-page="report" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                <line x1="4" y1="22" x2="4" y2="15" />
              </svg>
              <span>Report</span>
            </button>
            <button type="button" class="topnav-dropdown-item" data-page="about" role="menuitem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
              <span>About</span>
            </button>
            <div class="topnav-dropdown-divider" id="logout-divider" hidden></div>
            <button type="button" class="topnav-dropdown-item topnav-dropdown-item--danger" id="nav-logout"
              role="menuitem" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Dynamic content will be loaded here -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/components/movieCard.js"></script>
  <script src="js/components/carousel.js"></script>
  <script src="js/components/heroCarousel.js"></script>
  <script src="js/components/imageCropper.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/details.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/discover.js"></script>
  <script src="js/pages/anime.js"></script>
  <script src="js/pages/watch.js"></script>
  <script src="js/pages/person.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/downloads.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="js/versionCheck.js"></script>
  <script src="js/pages/activity.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
